name: Menta 88 - announcement recording

# Triggered at exact times by cron-job.org (POST .../dispatches), ~10 min before each slot.
# GitHub's own cron is too unreliable for this, so there is no schedule: block.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: menta-announcement-recording
  cancel-in-progress: false

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Cache Whisper model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-small

      - name: Listen, transcribe, notify
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          WHISPER_MODEL: small
          WINDOW_LOOKAHEAD_MINUTES: '15'
          WINDOW_BEFORE_SECONDS: '60'
          WINDOW_AFTER_SECONDS: '300'
          CHUNK_SECONDS: '10'
        run: python src/menta.py window

      - name: Upload MP3 chunks and timestamp metadata
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: menta-recordings-${{ github.run_id }}
          path: recordings/
          retention-days: 14
          if-no-files-found: warn
