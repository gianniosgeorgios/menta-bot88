name: Test stream (manual)

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Test audio recording and transcription
        env:
          EMAIL: ${{ secrets.EMAIL }}
          SURNAME: ${{ secrets.SURNAME }}
          FIRST_NAME: ${{ secrets.FIRST_NAME }}
          GENDER: ${{ secrets.GENDER }}
          AGE: ${{ secrets.AGE }}
          PHONE: ${{ secrets.PHONE }}
          AREA: ${{ secrets.AREA }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DRY_RUN: "true"
          WHISPER_MODEL: "small"
        run: |
          python src/menta.py test

      - name: Upload debug recordings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: menta-debug-recordings
          path: recordings/
          retention-days: 7
          if-no-files-found: warn
